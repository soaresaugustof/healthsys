apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: healthsys
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: user-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['user-service:8081']

      - job_name: patient-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['patient-service:8082']

      - job_name: triage-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['triage-service:8083']

      - job_name: record-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['record-service:8084']

      - job_name: bed-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['bed-service:8085']

      - job_name: notification-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['notification-service:8086']

      - job_name: api-gateway
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['api-gateway:8080']

      - job_name: analytics-service
        metrics_path: /metrics
        static_configs:
          - targets: ['analytics-service:8088']

      - job_name: ai-service
        metrics_path: /metrics
        static_configs:
          - targets: ['ai-service:8087']
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: healthsys
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      securityContext:
        fsGroup: 65534
        runAsUser: 65534
        runAsGroup: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:v2.52.0
          args:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.path=/prometheus'
            - '--storage.tsdb.retention.time=7d'
          ports:
            - containerPort: 9090
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "300m"
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: healthsys
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: healthsys
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
