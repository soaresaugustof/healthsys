# IMPORTANT: Replace these values before deploying to production.
# Generate base64 with: echo -n 'your-value' | base64
# Or use a secrets manager (Vault, AWS SSM, external-secrets-operator).
apiVersion: v1
kind: Secret
metadata:
  name: healthsys-secret
  namespace: healthsys
type: Opaque
stringData:
  DB_PASSWORD: secret
  JWT_SECRET: mySecretKeyForJWTGenerationThatIsLongEnough123456789
  # Postgres init credentials (used by the postgres StatefulSet)
  POSTGRES_USER: myuser
  POSTGRES_PASSWORD: secret
  POSTGRES_DB: healthsys
