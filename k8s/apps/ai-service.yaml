apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: healthsys
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      containers:
        - name: ai-service
          image: ghcr.io/OWNER/healthsys-ai-service:latest
          ports:
            - containerPort: 8087
          env:
            - name: PORT
              value: "8087"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          # Model loads lazily on first request — longer initial delay
          readinessProbe:
            tcpSocket:
              port: 8087
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: healthsys
spec:
  selector:
    app: ai-service
  ports:
    - port: 8087
      targetPort: 8087
