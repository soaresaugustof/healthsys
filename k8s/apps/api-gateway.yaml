apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: healthsys
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: ghcr.io/OWNER/healthsys-api-gateway:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: healthsys-config
            - secretRef:
                name: healthsys-secret
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
---
# LoadBalancer exposes the gateway to external traffic.
# On minikube: run `minikube service api-gateway -n healthsys` to get the URL.
# On cloud (GKE/EKS/AKS): an external IP is provisioned automatically.
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: healthsys
spec:
  type: LoadBalancer
  selector:
    app: api-gateway
  ports:
    - port: 80
      targetPort: 8080
