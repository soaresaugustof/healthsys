apiVersion: apps/v1
kind: Deployment
metadata:
  name: record-service
  namespace: healthsys
spec:
  replicas: 1
  selector:
    matchLabels:
      app: record-service
  template:
    metadata:
      labels:
        app: record-service
    spec:
      containers:
        - name: record-service
          image: ghcr.io/OWNER/healthsys-record-service:latest
          ports:
            - containerPort: 8084
          envFrom:
            - configMapRef:
                name: healthsys-config
            - secretRef:
                name: healthsys-secret
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            initialDelaySeconds: 60
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: record-service
  namespace: healthsys
spec:
  selector:
    app: record-service
  ports:
    - port: 8084
      targetPort: 8084
