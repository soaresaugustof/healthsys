name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:

  # ── Build & compile ────────────────────────────────────────────
  build-java:
    name: Build Java Services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build all Java services
        run: ./gradlew build -x test --no-daemon --parallel

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: java-jars
          path: '**/build/libs/app.jar'
          retention-days: 1

  build-python:
    name: Validate Python Services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install analytics-service deps
        run: pip install -r analytics-service/requirements.txt

      - name: Install ai-service deps
        run: pip install -r ai-service/requirements.txt

  # ── Docker build & push (main branch only) ────────────────────
  docker:
    name: Docker — ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: [build-java, build-python]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Java microservices — use root Dockerfile with build args
          - name: user-service
            context: .
            file: Dockerfile
            build_args: "SERVICE_NAME=user-service\nSERVICE_PORT=8081"

          - name: patient-service
            context: .
            file: Dockerfile
            build_args: "SERVICE_NAME=patient-service\nSERVICE_PORT=8082"

          - name: triage-service
            context: .
            file: Dockerfile
            build_args: "SERVICE_NAME=triage-service\nSERVICE_PORT=8083"

          - name: record-service
            context: .
            file: Dockerfile
            build_args: "SERVICE_NAME=record-service\nSERVICE_PORT=8084"

          - name: bed-service
            context: .
            file: Dockerfile
            build_args: "SERVICE_NAME=bed-service\nSERVICE_PORT=8085"

          - name: notification-service
            context: .
            file: Dockerfile
            build_args: "SERVICE_NAME=notification-service\nSERVICE_PORT=8086"

          - name: api-gateway
            context: .
            file: Dockerfile
            build_args: "SERVICE_NAME=api-gateway\nSERVICE_PORT=8080"

          - name: analytics-service
            context: ./analytics-service
            file: analytics-service/Dockerfile
            build_args: ""

          - name: ai-service
            context: ./ai-service
            file: ai-service/Dockerfile
            build_args: ""

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/healthsys-${{ matrix.name }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: healthsys-cluster
          location: us-central1
          project_id: project-6f254ebb-cabe-41df-8ff

      - name: Update image tags in manifests
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          for svc in user-service patient-service triage-service record-service \
                     bed-service notification-service api-gateway analytics-service ai-service; do
            sed -i "s|healthsys-${svc}:latest|healthsys-${svc}:${SHORT_SHA}|g" \
              k8s/apps/${svc}.yaml || true
          done

      - name: Apply namespace, configmap and secret
        run: |
          kubectl apply -f k8s/00-namespace.yaml
          kubectl apply -f k8s/01-configmap.yaml
          kubectl apply -f k8s/02-secret.yaml

      - name: Deploy infrastructure
        run: kubectl apply -f k8s/infra/

      - name: Deploy applications
        run: kubectl apply -f k8s/apps/

      - name: Deploy monitoring
        run: kubectl apply -f k8s/monitoring/

      - name: Wait for rollout
        run: |
          for svc in user-service patient-service triage-service record-service \
                     bed-service notification-service api-gateway; do
            kubectl rollout status deployment/${svc} -n healthsys --timeout=300s || true
          done
